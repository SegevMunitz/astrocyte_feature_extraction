[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astrocyte-feature-extraction"
version = "0.1.0"
description = "Cellpose-to-CellProfiler single-astrocyte feature extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=14",
  "PyYAML>=6",
  "scipy>=1.10,<2",
  "scikit-image>=0.21,<1",
  "tifffile>=2023.7.10",
]

[project.optional-dependencies]
segmentation = ["cellpose==3.1.1.1"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
astrocyte-pipeline = "astrocyte_feature_extraction.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astrocyte_feature_extraction"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["astrocyte_feature_extraction"]
